name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This calls the database every three days.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -o /dev/null -w '%{http_code}\n' -X POST \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/is_member" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}'
